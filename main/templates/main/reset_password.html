<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Password | AuraMatch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #0b1120; color: #f8fafc; font-family: 'Plus Jakarta Sans', sans-serif; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .brand-logo { font-weight: 700; letter-spacing: 2px; background: linear-gradient(45deg, #f43f5e, #fb7185); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .glass-card { background: rgba(30, 41, 59, 0.95); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 16px; box-shadow: 0 20px 40px rgba(0,0,0,0.5); width: 100%; max-width: 480px; padding: 40px; }
        .btn-rose { background: linear-gradient(135deg, #f43f5e, #e11d48); border: none; color: white; font-weight: 600; padding: 12px 24px; border-radius: 50px; width: 100%; transition: all 0.3s ease; }
        .btn-rose:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(244, 63, 94, 0.4); color: white; }
        .form-control { background-color: rgba(15, 23, 42, 0.95) !important; border: 1.5px solid rgba(255, 255, 255, 0.3) !important; color: #ffffff !important; border-radius: 10px; padding: 14px; }
        .form-control:focus { border-color: #f43f5e !important; box-shadow: 0 0 0 0.25rem rgba(244, 63, 94, 0.25) !important; }
        .code-input { text-align: center; font-size: 1.5rem; letter-spacing: 8px; }
    </style>
</head>
<body>

    <div class="glass-card text-center">
        <h2 class="brand-logo mb-3 fs-2">AURAMATCH</h2>
        <h4 class="fw-bold mb-2 text-white">Create New Password</h4>
        <p class="text-secondary small mb-4">Enter the 6-digit code sent to your email and your new password below.</p>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-danger bg-danger bg-opacity-20 border border-danger text-white small mb-3" role="alert">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3 text-start">
                <label class="form-label text-secondary small">Reset Code</label>
                <input type="text" name="code" class="form-control code-input" maxlength="6" placeholder="------" required autocomplete="off">
            </div>
            <div class="mb-4 text-start">
                <label class="form-label text-secondary small">New Password</label>
                <input type="password" name="new_password" class="form-control" placeholder="Enter new password" required>
            </div>
            <button type="submit" class="btn btn-rose py-3 mb-3">Update Password & Login</button>
        </form>

        <div class="text-center">
            <a href="{% url 'home' %}" class="text-decoration-none small" style="color: #fb7185;">← Back to Login</a>
        </div>
    </div>

</body>
</html>
