<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Profile | AuraMatch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background-color: #0a0f1e;
        }
        .hero-background {
            background-image: url('https://images.unsplash.com/photo-1518199266791-5375a83190b7?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 40px 20px;
        }
        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 15, 30, 0.9);
            z-index: 1;
        }
        .form-card {
            position: relative;
            z-index: 2;
            background: rgba(15, 23, 42, 0.95);
            padding: 35px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 650px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            color: #ffffff;
            max-height: 90vh;
            overflow-y: auto;
        }
        .form-card input, .form-card select, .form-card textarea {
            width: 100%;
            padding: 10px;
            margin-top: 4px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            color: white;
        }
        .form-card label { font-size: 13px; color: #cbd5e1; margin-top: 10px; display: block; }
        .submit-btn {
            background: #ff3366;
            color: white;
            border: none;
            padding: 12px 20px;
            width: 100%;
            font-size: 15px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 25px;
        }
        .submit-btn:hover { background: #e02e5b; }
    </style>
</head>
<body>
    <div class="hero-background">
        <div class="overlay"></div>
        <div class="form-card">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h3 style="color: #ff3366; margin: 0; font-size: 22px;">❤️ AURAMATCH</h3>
                <span class="text-secondary small fw-bold">Step 2 of 3: Profile Details</span>
            </div>
            <h4 class="mb-2" style="font-size: 20px;">Tell Us About Yourself</h4>
            <p class="text-secondary small mb-4">Provide your background information so our matchmakers can find your ideal matches.</p>

            {% if messages %}
                {% for message in messages %}
                    <div style="background: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; padding: 10px; border-radius: 5px; margin-bottom: 15px; font-size: 13px; color: #fca5a5;">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}

            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="submit-btn">Continue to Compatibility Questionnaire &rarr;</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
